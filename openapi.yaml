openapi: 3.0.4
info:
  title: Random User Generator
  description: >-
    Random User Generator produces realistic mock user profiles complete with
    full names, email addresses, usernames, birth dates, and phone numbers. Paid
    plans add batch generation, random passwords, and matching AI avatars.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/randomusergenerator:
    get:
      summary: Random User Generator
      description: Generate random user data
      operationId: randomusergenerator
      parameters:
        - name: count
          in: query
          schema:
            type: integer
          required: false
          description: The number of users to generate
          example: 1
        - name: includeAvatar
          in: query
          schema:
            type: boolean
          required: false
          description: Include an AI-generated face avatar matching user's gender and age
          example: true
        - name: gender
          in: query
          schema:
            type: string
          required: false
          description: Only generate users of this gender
        - name: nationality
          in: query
          schema:
            type: string
          required: false
          description: >-
            ISO country code for localised names, phone numbers and addresses
            (e.g. DE, JP, BR). Defaults to US
        - name: seed
          in: query
          schema:
            type: string
          required: false
          description: >-
            Any string; the same seed (with the same other parameters) returns
            the same users, for repeatable test data
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  - id: aeb01cae-300b-4e54-9cb0-76ce52d6b315
                    name: Monique Torp
                    gender: Female
                    username: Monique.Torp
                    email: Monique_Torp41@hotmail.com
                    password: V7s6IHRMhlniG98
                    registered: '2026-01-10T15:18:03.898Z'
                    phone: 1-967-684-8927 x83452
                    cell: 1-555-737-7469 x885
                    birthdate: '1976-03-25T20:38:58.998Z'
                    age: 50
                    nationality: US
                    location:
                      street: 6858 Darrick Ramp
                      city: Parkersburg
                      state: West Virginia
                      postcode: 31811-8127
                      country: United States of America
                      countryCode: US
                      latitude: 39.27687
                      longitude: -81.56839
                      timezone: America/New_York
                    login:
                      salt: xh1696HT
                      md5: 5ebad82435f817d5837916fa2885b95c
                      sha1: b62baac1003eed109f32b3305bf049516f175819
                      sha256: 02a99836191088b702972c5153c9d4ce2290d39bb90de141b467f302e62e8143
                    avatar: https://storage.googleapis.com/apiverve/APIResources/faces/Female/50-60/87654321.jpg?X-Goog-Signature=...
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
